 <div class="container">
     <form id="contact-form" action="http://localhost:3000/submit-form" method="post">
            <label for="name">First Name:</label>
            <input type="text" id="firstname" namespace="John" required>

            <label for="name">Last Name:</label>
            <input type="text" id="lastname" namespace="Mensah" required>
            
            <label for="phone">Phone:</label>
            <input type="text" id="phone" namespace="+233********" required>


            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            <label for="Payment">Methods of Payment</label>
            <select class="option" name="payment" id="payment" namespace="PAYMENT method">
                <option value="Mobile Money">Select Payment Method</option>

                <option value="">Mobile Money</option>
                <option value="Bank Transfer">Bank Transfer</option>
                <option value="Cash">Cash</option>
                <option value="Cryto Exchange">CRYPTO Exchange</option>

            </select>
            <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>
            <br><br>

            <button class="submit" type="submit">Send</button>
        </form>
        <p id="responseMessage"></p>
